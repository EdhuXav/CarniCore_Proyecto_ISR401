# ---------------------------------------------------------------------------
# CarniCore -- orquestacion local
#
# Requisito previo:
#   cp backend/.env.example backend/.env   y editelo
#
# Cambios respecto de la version anterior:
#   - Los secretos salen del archivo de compose y pasan a backend/.env, que
#     no se versiona. Antes estaban en claro aqui y en el README publico.
#   - PostgreSQL deja de publicar el puerto 5432 en el host: el backend lo
#     alcanza por la red interna de Docker y no hace falta exponerlo. Si lo
#     necesita para depurar, descomente el bloque `ports`.
#   - `version:` se elimina: esta obsoleto en Compose v2 y genera un aviso.
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    container_name: carnicore_postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: ${DB_NAME:-carnicore}
      POSTGRES_USER: ${DB_USER:-carnicore_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en backend/.env}
    # Descomente solo si necesita conectarse desde el host para depurar.
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - carnicore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-carnicore_user} -d ${DB_NAME:-carnicore}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carnicore_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  # Cliente opcional para explorar la base de datos.
  # Actívelo con: docker compose --profile tools up -d pgadmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: carnicore_pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    env_file:
      - ./backend/.env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Defina PGADMIN_EMAIL en backend/.env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Defina PGADMIN_PASSWORD en backend/.env}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres

volumes:
  carnicore_pgdata:
