version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: carnicore_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: carnicore
      POSTGRES_USER: carnicore_user
      POSTGRES_PASSWORD: carnicore_pass
    ports:
      - "5432:5432"
    volumes:
      - carnicore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carnicore_user -d carnicore"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carnicore_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  # Cliente opcional para explorar la base de datos desde el navegador.
  # Actívalo con: docker compose --profile tools up -d pgadmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: carnicore_pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@carnicore.ec
      PGADMIN_DEFAULT_PASSWORD: carnicore_pass
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  carnicore_pgdata:
